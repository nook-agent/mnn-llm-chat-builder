name: Build MNNLLMChat IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Checkout alibaba/MNN
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          ref: 5b74a931887ba5b4d9f65b222cc18dd1a16599a8
          path: MNN
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes

      - name: Verify and apply custom model support
        run: |
          cat custom_models/CustomModelCore.swift tests/CustomModelCoreTests.swift > /tmp/mnn-core-tests.swift
          swift /tmp/mnn-core-tests.swift
          python3 scripts/apply_custom_models.py MNN

      - name: Build MNN.framework
        working-directory: MNN
        run: |
          sh package_scripts/ios/buildiOS.sh \
            -DMNN_ARM82=ON \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_BUILD_LLM=ON \
            -DMNN_CPU_WEIGHT_DEQUANT_GEMM=ON \
            -DMNN_METAL=ON \
            -DMNN_BUILD_DIFFUSION=ON \
            -DMNN_OPENCL=OFF \
            -DMNN_SEP_BUILD=OFF \
            -DLLM_SUPPORT_AUDIO=ON \
            -DMNN_BUILD_AUDIO=ON \
            -DLLM_SUPPORT_VISION=ON \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_BUILD_LLM_OMNI=ON

      - name: Copy MNN.framework into iOS Project
        working-directory: MNN
        run: |
          echo "Checking built framework..."
          ls -ld MNN-iOS-CPU-GPU/Static/MNN.framework
          cp -R MNN-iOS-CPU-GPU/Static/MNN.framework apps/iOS/MNNLLMChat/
          ls -ld apps/iOS/MNNLLMChat/MNN.framework

      - name: Build MNNLLMiOS with xcodebuild
        working-directory: MNN/apps/iOS/MNNLLMChat
        run: |
          xcodebuild clean build \
            -project MNNLLMiOS.xcodeproj \
            -scheme MNNLLMiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            BUILD_DIR="${PWD}/build"

      - name: Package Unsigned IPA
        working-directory: MNN/apps/iOS/MNNLLMChat
        run: |
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/MNNLLMiOS.app build/Payload/
          cd build
          zip -r -9 MNNLLMChat.ipa Payload
          ls -lh MNNLLMChat.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNNLLMChat-ipa
          path: MNN/apps/iOS/MNNLLMChat/build/MNNLLMChat.ipa
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.5-build-${{ github.run_number }}"
          gh release create "$TAG" \
            MNN/apps/iOS/MNNLLMChat/build/MNNLLMChat.ipa \
            --title "MNNLLMChat iOS ($TAG)" \
            --notes "Unsigned iOS build with global Hugging Face search, repository/folder URL downloads, and Files folder/multi-file import. Public MNN models only; unzip archives in Files before import. Source pinned to 5b74a931887ba5b4d9f65b222cc18dd1a16599a8. Requires signing; physical-device inference has not been verified."
